spring.application.name=eventSource

# Configuração do PostgreSQL (Banco de Leitura / CQRS)
spring.datasource.url=jdbc:postgresql://localhost:5432/logistica_leitura
spring.datasource.username=postgres
spring.datasource.password=postgres123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults = false
spring.jpa.database-platform= org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type=trace


# Endereço do EventStoreDB (Banco de Escrita / Eventos)
eventstore.connection-string=esdb://localhost:2113?tls=false